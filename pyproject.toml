[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-intelligence"
version = "0.1.0"
description = "Personal AI brain: Graph + RAG + LangGraph + OpenRouter"
requires-python = ">=3.11"

dependencies = [
    # ── LLM / Agent ──────────────────────────────────────────────
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.1.0",
    "openai>=1.30.0",              # OpenRouter is OpenAI-compatible

    # ── Vector store ─────────────────────────────────────────────
    "qdrant-client>=1.9.0",
    "langchain-qdrant>=0.1.0",

    # ── Graph DB ─────────────────────────────────────────────────
    "neo4j>=5.19.0",

    # ── Relational DB ────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # ── Cache ────────────────────────────────────────────────────
    "redis[asyncio]>=5.0.0",

    # ── Reranker ─────────────────────────────────────────────────
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",

    # ── Ingestion ────────────────────────────────────────────────
    "unstructured[pdf,docx]>=0.14.0",
    "pypdf>=4.0.0",
    "rank-bm25>=0.2.2",
    "spacy>=3.7.0",

    # ── Evals ────────────────────────────────────────────────────
    "ragas>=0.1.0",
    "datasets>=2.19.0",

    # ── Protection ───────────────────────────────────────────────
    "guardrails-ai>=0.4.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",

    # ── Telegram ─────────────────────────────────────────────────
    "python-telegram-bot[job-queue]>=21.0.0",

    # ── API ──────────────────────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",

    # ── Monitoring ───────────────────────────────────────────────
    "prometheus-client>=0.20.0",
    "structlog>=24.0.0",
    "sentry-sdk[fastapi]>=2.0.0",

    # ── Utils ────────────────────────────────────────────────────
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "tenacity>=8.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "freezegun>=1.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["personal_intelligence*"]

[tool.setuptools.package-data]
personal_intelligence = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
